name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Smoke test
        shell: pwsh
        run: |
          $dir = "build\${{ matrix.configuration }}"
          foreach ($name in @("uiauf.exe", "UIA-UF.Service.exe", "UIA-UF.Manager.exe")) {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "missing $dir\$name" }
          }
          & (Join-Path $dir "uiauf.exe") help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uiauf help exited with $LASTEXITCODE" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UIA-UF-${{ matrix.configuration }}
          # 通配符而不是逐个列举：新增可执行目标时不会再漏掉
          path: build/${{ matrix.configuration }}/*.exe
          if-no-files-found: error

  test:
    name: tests
    needs: build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: UIA-UF-Release
          path: bin

      - name: Run tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -BinDir bin

      - name: Service log on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:ProgramData 'UIA-UF\service.log'
          if (Test-Path $log) {
            Get-Content $log -Encoding Unicode
          } else {
            Write-Host "未生成 service.log：$log"
          }

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        shell: pwsh
        run: |
          $zip = "UIA-UF-${{ github.ref_name }}.zip"
          Compress-Archive -Path artifacts/UIA-UF-Release/* -DestinationPath $zip
          Get-ChildItem $zip | Select-Object Name, Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $zip = "UIA-UF-$tag.zip"

          # 发布说明优先取 CHANGELOG 里对应的版本段落
          $notes = $null
          $version = $tag -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" |
            Select-Object -First 1).LineNumber
          if ($start) {
            $body = @()
            for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($i -gt $start -and $lines[$i] -match '^## ') { break }
              $body += $lines[$i]
            }
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            $body | Set-Content -Path $notes -Encoding utf8
          }

          # 幂等：release 已存在时只更新附件和说明，避免重跑失败
          gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --repo $repo --clobber
            if ($notes) { gh release edit $tag --repo $repo --notes-file $notes }
          } elseif ($notes) {
            gh release create $tag $zip --repo $repo --title $tag --notes-file $notes
          } else {
            gh release create $tag $zip --repo $repo --title $tag --generate-notes
          }
