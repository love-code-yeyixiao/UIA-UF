name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Smoke test
        shell: pwsh
        run: |
          $dir = "build\${{ matrix.configuration }}"
          foreach ($name in @("uiauf.exe", "UIA-UF.Service.exe")) {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "missing $dir\$name" }
          }
          & (Join-Path $dir "uiauf.exe") help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uiauf help exited with $LASTEXITCODE" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UIA-UF-${{ matrix.configuration }}
          path: |
            build/${{ matrix.configuration }}/uiauf.exe
            build/${{ matrix.configuration }}/UIA-UF.Service.exe
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        shell: pwsh
        run: |
          $zip = "UIA-UF-${{ github.ref_name }}.zip"
          Compress-Archive -Path artifacts/UIA-UF-Release/* -DestinationPath $zip
          Get-ChildItem $zip | Select-Object Name, Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "UIA-UF-$tag.zip"
          gh release create $tag $zip --repo "${{ github.repository }}" --title $tag --generate-notes
